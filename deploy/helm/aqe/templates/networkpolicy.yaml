{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aqe-default-deny-with-required-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: aqe}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.infrastructureNamespace | quote }}}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6333}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 8001}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.messagingNamespace | quote }}}
      ports:
        - {protocol: TCP, port: 9092}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 7233}
        - {protocol: TCP, port: 9000}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
    {{- with .Values.networkPolicy.llmEgressCidr }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {protocol: TCP, port: {{ $.Values.networkPolicy.llmEgressPort }}}
    {{- end }}
{{- end }}
