services:
  # --- Infrastructure Services ---

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: qe_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      # Use a volume for data persistence
      - postgres_data:/var/lib/postgresql/data
      # Initialize the schema using the artifact_metadata.sql script
      - ./utils/db_setup/artifact_metadata.sql:/docker-entrypoint-initdb.d/artifact_metadata.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d qe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      MINIO_ROOT_PASSWORD: minioadmin
    command: /data
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port

  rustfs_init:
    image: amazon/aws-cli:2.31.23
    depends_on:
      rustfs: {condition: service_started}
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket agentic-qe-artifacts >/dev/null 2>&1 ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket agentic-qe-artifacts

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333" # GRPC/HTTP API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- REDIS CACHE SERVICE ---
  redis:
    image: redis:7.0-alpine
    container_name: redis_cache
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  # --- END REDIS SERVICE ---

  # 1. Zookeeper Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      # Required environment variables for ZooKeeper
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  # 2. Kafka Service (configured to use Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper  # Ensure ZooKeeper starts before Kafka
    environment:
      # Configure Kafka where to find the Zookeeper service (using the service name 'zookeeper' and port 2181)
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 
      # Define the broker ID (must be unique if you have more than one broker)
      KAFKA_BROKER_ID: 1
      # Define listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092
      # Define advertised listeners for external connections
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # Other standard settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: always
    
  # --- Application Agents (browser-free unless explicitly identified) ---
  
  # 0. Artifact Management Agent (PostgreSQL metadata and RustFS objects)
  artifact_management_agent:
    build:
      context: .
      dockerfile: agents/artifact_management/Dockerfile
    container_name: artifact_management_agent
    environment:
      AGENT_PORT: 8007
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      REDIS_HOST: redis
    ports:
      - "8007:8007"
    depends_on: [postgres, rustfs_init, redis]

  # 1. Orchestrator
  change_detection_agent:
    build:
      context: .
      dockerfile: agents/change_detection/Dockerfile
    container_name: change_detection_agent
    environment:
      AGENT_PORT: 8000
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      QDRANT_HOST: qdrant
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis # Added Redis host
    ports:
      - "8000:8000"
    depends_on: [postgres, rustfs_init, qdrant, kafka, redis, artifact_management_agent]

  # 2. Test Generation Agent
  test_generation_agent:
    build:
      context: .
      dockerfile: agents/test_generation/Dockerfile
    container_name: test_generation_agent_multi_llm
    environment:
      AGENT_PORT: 8001
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      QDRANT_HOST: qdrant
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis # Added Redis host
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-SELF_HOSTED}
      LLM_EMBEDDING_ENDPOINT: ${LLM_EMBEDDING_ENDPOINT:-}
      LLM_GENERATION_ENDPOINT: ${LLM_GENERATION_ENDPOINT:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-540}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      TEST_CATALOG_REPOSITORY: ${TEST_CATALOG_REPOSITORY:-}
      TEST_CATALOG_BRANCH: ${TEST_CATALOG_BRANCH:-aqe-generated-tests}
      TEST_CATALOG_GITHUB_TOKEN: ${TEST_CATALOG_GITHUB_TOKEN:-}
      GRAPH_API_URL: http://diagnostics_agent:8006/v1/graph/events
    ports:
      - "8001:8001"
    depends_on: [postgres, rustfs_init, qdrant, kafka, redis, artifact_management_agent]

  quality_oracle_agent:
    build:
      context: .
      dockerfile: agents/quality_oracle/Dockerfile
    environment:
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-rustfsadmin}"
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-SELF_HOSTED}
      LLM_GENERATION_ENDPOINT: ${LLM_GENERATION_ENDPOINT:-}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
      ORACLE_PROVIDER_MODE: ${ORACLE_PROVIDER_MODE:-}
      ORACLE_GENERATION_ENDPOINT: ${ORACLE_GENERATION_ENDPOINT:-}
      ORACLE_GENERATION_MODEL: ${ORACLE_GENERATION_MODEL:-}
      ORACLE_REASONING_EFFORT: ${ORACLE_REASONING_EFFORT:-high}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ORACLE_GEMINI_API_KEY: ${ORACLE_GEMINI_API_KEY:-}
    ports:
      - "8017:8017"
    depends_on: [rustfs_init, test_generation_agent]

  github_analysis_agent:
    build:
      context: .
      dockerfile: agents/github_analysis/Dockerfile
    container_name: github_analysis_agent
    environment:
      AGENT_PORT: 8010
      GITHUB_SOURCE_ALLOWED_REPOSITORIES: ${GITHUB_SOURCE_ALLOWED_REPOSITORIES:-}
      GITHUB_SOURCE_TOKEN: ${GITHUB_SOURCE_TOKEN:-}
    ports:
      - "8010:8010"

  agent_builder_agent:
    build:
      context: .
      dockerfile: agents/agent_builder/Dockerfile
    environment:
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      LLM_GENERATION_ENDPOINT: ${LLM_GENERATION_ENDPOINT:-}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
      SOURCE_ANALYSIS_URL: http://github_analysis_agent:8010/v1/analyze
    ports:
      - "8015:8015"
    depends_on: [rustfs_init, github_analysis_agent]

  dbt_builder_agent:
    build:
      context: .
      dockerfile: agents/dbt_builder/Dockerfile
    environment:
      DBT_BUILDER_PUBLIC_URL: http://dbt_builder_agent:8016
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      LLM_GENERATION_ENDPOINT: ${LLM_GENERATION_ENDPOINT:-}
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-}
    ports:
      - "8016:8016"
    depends_on: [rustfs_init]

  github_connector_agent:
    build:
      context: .
      dockerfile: agents/github_connector/Dockerfile
    environment:
      GITHUB_MCP_URL: ${GITHUB_MCP_URL:-https://api.githubcopilot.com/mcp/x/repos/readonly}
      GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
      GITHUB_MCP_ALLOWED_TOOLS: ${GITHUB_MCP_ALLOWED_TOOLS:-get_file_contents,get_commit,list_branches,search_code}
      GITHUB_SOURCE_ALLOWED_REPOSITORIES: ${GITHUB_SOURCE_ALLOWED_REPOSITORIES:-}
    ports:
      - "8014:8014"

  github_commit_agent:
    build:
      context: .
      dockerfile: agents/github_commit/Dockerfile
    environment:
      AGENT_PORT: 8011
      KAFKA_BROKER: kafka:9092
      GITHUB_PAT: ${GITHUB_PAT:-}
    ports:
      - "8011:8011"
    depends_on: [kafka]
  
  # 3. Webpage State Capture Agent (New)
  webpage_state_capture_agent:
    build:
      context: .
      dockerfile: agents/webpage_state_capture/Dockerfile
    container_name: webpage_state_capture_agent
    environment:
      AGENT_PORT: 8002
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      REDIS_HOST: redis # Added Redis host
    ports:
      - "8002:8002"
    depends_on: [postgres, rustfs_init, redis, artifact_management_agent]

  # 4. Test Execution Agent (New)
  test_execution_agent:
    # --- CRITICAL FIX: Point to the specialized build context ---
    build:
      context: .
      dockerfile: agents/test_execution/Dockerfile
    container_name: test_execution_agent
    environment:
      AGENT_PORT: 8003
      KAFKA_BROKER: kafka:9092
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      EXECUTION_TIMEOUT_SECONDS: 180
      TEST_EXECUTION_MODE: agent
      MAX_REPAIR_ATTEMPTS: 2
      REPAIR_LLM_URL: ${REPAIR_LLM_URL:-}
      REPAIR_LLM_MODEL: ${REPAIR_LLM_MODEL:-}
      REPAIR_LLM_API_KEY: ${REPAIR_LLM_API_KEY:-}
      TEST_CATALOG_REPOSITORY: ${TEST_CATALOG_REPOSITORY:-}
      TEST_CATALOG_BRANCH: ${TEST_CATALOG_BRANCH:-aqe-generated-tests}
      TEST_CATALOG_GITHUB_TOKEN: ${TEST_CATALOG_GITHUB_TOKEN:-}
    # Command change: Running the agent file directly from the new image
    ports:
      - "8003:8003"
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_started}
      rustfs_init: {condition: service_completed_successfully}
    # --- END CRITICAL FIX ---

  website_test_execution_agent:
    build:
      context: .
      dockerfile: agents/website_execution/Dockerfile
    container_name: website_test_execution_agent
    environment:
      AGENT_PORT: 8013
      TEST_EXECUTION_MODE: website
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      EXECUTION_TIMEOUT_SECONDS: 180
      MAX_REPAIR_ATTEMPTS: 2
    ports:
      - "8013:8013"
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_started}
      rustfs_init: {condition: service_completed_successfully}

  temporal:
    image: temporalio/temporal:1.5.1
    command: [server, start-dev, --ip, 0.0.0.0]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, temporal:7233]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal_worker:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: aqe-workflows
      TEMPORAL_UI_URL: http://127.0.0.1:18088
      AGENT_TEST_EXECUTION_URL: http://test_execution_agent:8003/run_tests
      WEBSITE_TEST_EXECUTION_URL: http://website_test_execution_agent:8013/run_tests
      SOURCE_ANALYSIS_URL: http://github_analysis_agent:8010/v1/analyze
      QUALITY_ORACLE_URL: http://quality_oracle_agent:8017/v1/reviews
      GRAPH_EVENTS_URL: http://diagnostics_agent:8006/v1/graph/events
    depends_on:
      temporal: {condition: service_healthy}
      test_generation_agent: {condition: service_started}
      test_execution_agent: {condition: service_started}
      website_test_execution_agent: {condition: service_started}
      github_analysis_agent: {condition: service_started}
      quality_oracle_agent: {condition: service_started}

  workflow_api:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    command: [uvicorn, temporal_worker.api:app, --host, 0.0.0.0, --port, "8008"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: aqe-workflows
    ports:
      - "8008:8008"
    depends_on:
      temporal: {condition: service_healthy}
    networks:
      default:
        aliases: [aqe-workflow-api]

  aqe_byoa:
    build:
      context: .
      dockerfile: Dockerfile.byoa
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${PLATFORM_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REGISTRY_URL: ${PLATFORM_REGISTRY_URL:-}
      AGENT_ENDPOINT: ${AQE_AGENT_ENDPOINT:-http://aqe_byoa:8009}
    ports:
      - "8009:8009"
    depends_on:
      - kafka
      - workflow_api
      - test_execution_agent

  diagnostics_agent:
    build:
      context: .
      dockerfile: agents/diagnostics/Dockerfile
    environment:
      AGENT_PROBE_ALLOWED_HOSTS: "agent_builder_agent,artifact_management_agent,change_detection_agent,dbt_builder_agent,test_generation_agent,quality_oracle_agent,github_analysis_agent,github_connector_agent,github_commit_agent,webpage_state_capture_agent,test_execution_agent,website_test_execution_agent,llm_fine_tuning_agent,aqe_byoa,host.docker.internal"
      DIAGNOSTICS_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8006:8006"
    depends_on:
      - agent_builder_agent
      - artifact_management_agent
      - change_detection_agent
      - dbt_builder_agent
      - test_generation_agent
      - quality_oracle_agent
      - github_analysis_agent
      - github_connector_agent
      - github_commit_agent
      - webpage_state_capture_agent
      - test_execution_agent
      - website_test_execution_agent
      - llm_fine_tuning_agent
      - aqe_byoa
    networks:
      default:
        aliases: [aqe-diagnostics]

  # 5. Knowledge Ingestion Agent
  llm_fine_tuning_agent:
    build:
      context: .
      dockerfile: agents/knowledge_ingestion/Dockerfile
    container_name: llm_fine_tuning_agent
    environment:
      AGENT_PORT: 8004
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      QDRANT_HOST: qdrant
      REDIS_HOST: redis # Added Redis host
    ports:
      - "8004:8004"
    depends_on: [postgres, rustfs_init, qdrant, redis, artifact_management_agent]

  # --- Reporting Kafka consumer ---
  test_reporting_service:
    build:
      context: .  
      dockerfile: Dockerfile.reporting 
    container_name: test_reporting_service
    depends_on:
      - kafka
      - postgres 
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_URL: postgresql://user:pass@postgres:5432/qe_db
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qellm-frontend
    ports:
      - "3000:8080"
    volumes:
      # This is critical for development: it ensures Nginx uses the latest version 
      # of your app.jsx file without rebuilding the container every time.
      - ./frontend:/usr/share/nginx/html/ 
    networks:
      default:
        aliases: [aqe-frontend]

volumes:
  postgres_data:
  rustfs_data:
  qdrant_data:
  redis_data: # ADDED: Volume for persistent Redis data
