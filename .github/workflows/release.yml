name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require main or a tag reachable from main
        run: |
          git fetch origin main
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            test "$GITHUB_REF" = refs/heads/main
          fi

  model-evaluation:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-source
    uses: ./.github/workflows/model-evaluation.yml
    with:
      require_live: true
    secrets: inherit

  candidate-integration:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run disposable integration environment and telemetry checks
        run: test/e2e/run.sh

  images:
    needs: release-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {name: agent-builder, dockerfile: agents/agent_builder/Dockerfile}
          - {name: artifact-management, dockerfile: agents/artifact_management/Dockerfile}
          - {name: change-detection, dockerfile: agents/change_detection/Dockerfile}
          - {name: dbt-builder, dockerfile: agents/dbt_builder/Dockerfile}
          - {name: diagnostics, dockerfile: agents/diagnostics/Dockerfile}
          - {name: github-analysis, dockerfile: agents/github_analysis/Dockerfile}
          - {name: github-connector, dockerfile: agents/github_connector/Dockerfile}
          - {name: github-commit, dockerfile: agents/github_commit/Dockerfile}
          - {name: knowledge-ingestion, dockerfile: agents/knowledge_ingestion/Dockerfile}
          - {name: quality-oracle, dockerfile: agents/quality_oracle/Dockerfile}
          - {name: test-generation, dockerfile: agents/test_generation/Dockerfile}
          - {name: test-execution, dockerfile: agents/test_execution/Dockerfile}
          - {name: webpage-state-capture, dockerfile: agents/webpage_state_capture/Dockerfile}
          - {name: website-execution, dockerfile: agents/website_execution/Dockerfile}
          - {name: temporal, dockerfile: Dockerfile.temporal}
          - {name: byoa, dockerfile: Dockerfile.byoa}
          - {name: reporting, dockerfile: Dockerfile.reporting}
          - {name: frontend, dockerfile: Dockerfile.frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/aqe-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Promote verified SHA manifest without rebuilding
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aqe-${{ matrix.name }}
          VERSION: ${{ github.ref_name }}
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$sha_tag"

  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm package deploy/helm/aqe --destination dist
      - uses: actions/upload-artifact@v4
        with: {name: aqe-helm-chart, path: dist/*.tgz}

  general-availability:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [model-evaluation, candidate-integration, images, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: aqe-helm-chart, path: dist}
      - name: Create release checksums
        run: sha256sum dist/*.tgz > dist/SHA256SUMS
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "AQE $GITHUB_REF_NAME" \
            dist/*.tgz dist/SHA256SUMS

  release-notification:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [model-evaluation, candidate-integration, images, chart, general-availability]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release result to Slack when configured
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.RELEASE_SLACK_WEBHOOK_URL }}
          MODEL_RESULT: ${{ needs.model-evaluation.result }}
          INTEGRATION_RESULT: ${{ needs.candidate-integration.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
          CHART_RESULT: ${{ needs.chart.result }}
          GA_RESULT: ${{ needs.general-availability.result }}
        run: |
          summary="AQE ${GITHUB_REF_NAME}: GA=${GA_RESULT}, model=${MODEL_RESULT}, integration=${INTEGRATION_RESULT}, images=${IMAGE_RESULT}, chart=${CHART_RESULT}"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          test -z "$SLACK_WEBHOOK_URL" && exit 0
          jq -n --arg text "$summary — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{text:$text}' > /tmp/slack.json
          curl --fail --silent --show-error -H 'content-type: application/json' --data @/tmp/slack.json "$SLACK_WEBHOOK_URL"
