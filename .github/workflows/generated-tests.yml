name: Versioned agent E2E catalog

on:
  push:
    branches: [aqe-generated-tests]
    paths:
      - generated-tests/**
      - generated-findings/**
      - .github/workflows/generated-tests.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: generated-agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-e2e:
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: generated-agent-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ vars.E2E_RUNNER == '' }}
        with: {python-version: "3.12", cache: pip}
      - name: Use installed Python on the self-hosted runner
        if: ${{ vars.E2E_RUNNER != '' }}
        run: |
          python_bin=$(command -v python3.12 || command -v python3)
          "$python_bin" -m venv "$RUNNER_TEMP/aqe-catalog-python"
          echo "$RUNNER_TEMP/aqe-catalog-python/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pytest httpx
      - name: Run versioned HTTP agent tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
          AGENT_CARD_URL: ${{ vars.AGENT_CARD_URL }}
          TARGET_AUTH_TYPE: ${{ vars.TARGET_AUTH_TYPE }}
          TARGET_AUTH_TOKEN: ${{ secrets.TARGET_AUTH_TOKEN }}
          TARGET_AUTH_USERNAME: ${{ secrets.TARGET_AUTH_USERNAME }}
          TARGET_AUTH_PASSWORD: ${{ secrets.TARGET_AUTH_PASSWORD }}
          TARGET_AUTH_API_KEY: ${{ secrets.TARGET_AUTH_API_KEY }}
        run: test ! -d generated-tests/agent || python -m pytest -q generated-tests/agent

  website-e2e:
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: generated-agent-e2e
    steps:
      - uses: actions/checkout@v4
      - id: inventory
        run: echo "present=$([[ -d generated-tests/website ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: ${{ steps.inventory.outputs.present == 'true' && vars.E2E_RUNNER == '' }}
        with: {python-version: "3.12", cache: pip}
      - name: Use installed Python on the self-hosted runner
        if: ${{ steps.inventory.outputs.present == 'true' && vars.E2E_RUNNER != '' }}
        run: |
          python_bin=$(command -v python3.12 || command -v python3)
          "$python_bin" -m venv "$RUNNER_TEMP/aqe-catalog-python"
          echo "$RUNNER_TEMP/aqe-catalog-python/bin" >> "$GITHUB_PATH"
      - if: ${{ steps.inventory.outputs.present == 'true' }}
        run: python -m pip install pytest pytest-playwright httpx
      - if: ${{ steps.inventory.outputs.present == 'true' }}
        run: python -m playwright install --with-deps chromium
      - name: Run versioned Playwright website tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          TARGET_BASE_URL: ${{ vars.TARGET_BASE_URL }}
          TARGET_AUTH_TYPE: ${{ vars.TARGET_AUTH_TYPE }}
          TARGET_AUTH_LOGIN_URL: ${{ vars.TARGET_AUTH_LOGIN_URL }}
          TARGET_AUTH_USERNAME_SELECTOR: ${{ vars.TARGET_AUTH_USERNAME_SELECTOR }}
          TARGET_AUTH_PASSWORD_SELECTOR: ${{ vars.TARGET_AUTH_PASSWORD_SELECTOR }}
          TARGET_AUTH_SUBMIT_SELECTOR: ${{ vars.TARGET_AUTH_SUBMIT_SELECTOR }}
          TARGET_AUTH_USERNAME: ${{ secrets.TARGET_AUTH_USERNAME }}
          TARGET_AUTH_PASSWORD: ${{ secrets.TARGET_AUTH_PASSWORD }}
        run: test ! -d generated-tests/website || python -m pytest -q generated-tests/website

  confirmed-findings:
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: generated-agent-e2e
    steps:
      - uses: actions/checkout@v4
      - id: inventory
        run: echo "present=$([[ -d generated-findings ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: ${{ steps.inventory.outputs.present == 'true' && vars.E2E_RUNNER == '' }}
        with: {python-version: "3.12", cache: pip}
      - name: Use installed Python on the self-hosted runner
        if: ${{ steps.inventory.outputs.present == 'true' && vars.E2E_RUNNER != '' }}
        run: |
          python_bin=$(command -v python3.12 || command -v python3)
          "$python_bin" -m venv "$RUNNER_TEMP/aqe-catalog-python"
          echo "$RUNNER_TEMP/aqe-catalog-python/bin" >> "$GITHUB_PATH"
      - if: ${{ steps.inventory.outputs.present == 'true' }}
        run: python -m pip install pytest pytest-playwright httpx
      - if: ${{ steps.inventory.outputs.present == 'true' }}
        run: python -m playwright install --with-deps chromium
      - name: Verify confirmed issues still reproduce as assertion failures
        env:
          PYTHONPATH: ${{ github.workspace }}
          AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
          AGENT_CARD_URL: ${{ vars.AGENT_CARD_URL }}
          TARGET_BASE_URL: ${{ vars.TARGET_BASE_URL }}
          TARGET_AUTH_TYPE: ${{ vars.TARGET_AUTH_TYPE }}
          TARGET_AUTH_TOKEN: ${{ secrets.TARGET_AUTH_TOKEN }}
          TARGET_AUTH_USERNAME: ${{ secrets.TARGET_AUTH_USERNAME }}
          TARGET_AUTH_PASSWORD: ${{ secrets.TARGET_AUTH_PASSWORD }}
          TARGET_AUTH_API_KEY: ${{ secrets.TARGET_AUTH_API_KEY }}
        run: |
          test ! -d generated-findings && exit 0
          while IFS= read -r -d '' test_file; do
            set +e
            python -m pytest -q "$test_file"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Confirmed finding no longer reproduces: $test_file"
              exit 1
            fi
            if [ "$status" -ne 1 ]; then
              echo "Finding has an execution/collection error ($status): $test_file"
              exit "$status"
            fi
          done < <(find generated-findings -name 'test_*.py' -print0)
