name: CI

on:
  pull_request: {}
  merge_group: {}
  push: {branches: [main]}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image_matrix: ${{ steps.select.outputs.image_matrix }}
      image_count: ${{ steps.select.outputs.image_count }}
      run_e2e: ${{ steps.select.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: select
        name: Select affected workloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if test -z "$BASE_SHA" || test "$BASE_SHA" = "0000000000000000000000000000000000000000"; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > /tmp/changed-paths
          selection=$(python .github/scripts/ci-matrix.py < /tmp/changed-paths)
          {
            echo "image_matrix=$(jq -c .image_matrix <<<"$selection")"
            echo "image_count=$(jq -r .image_count <<<"$selection")"
            echo "run_e2e=$(jq -r .run_e2e <<<"$selection")"
          } >> "$GITHUB_OUTPUT"

  unit-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest-playwright
      - run: python -m compileall -q agents service temporal_worker byoa_adapter evaluation
      - run: pytest -q test
      - run: python evaluation/run.py --minimum-score 1.0
      - run: docker compose config --quiet

  helm-and-argocd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/aqe
      - run: helm template aqe deploy/helm/aqe > /tmp/aqe-manifests.yaml
      - run: helm template aqe deploy/helm/aqe -f deploy/helm/aqe/values-agentic-platform.yaml > /tmp/aqe-platform-manifests.yaml
      - name: Validate agent ownership and Argo CD YAML
        run: |
          test "$(find agents -mindepth 2 -maxdepth 2 -name agent.yaml | wc -l)" -eq 10
          test "$(find agents -mindepth 2 -maxdepth 2 -name Dockerfile | wc -l)" -eq 10
          test "$(find agents -mindepth 2 -maxdepth 2 -name app.py | wc -l)" -eq 10
          ruby -e 'require "yaml"; abort "not an Application" unless YAML.load_file("deploy/argocd/application.yaml")["kind"] == "Application"; abort "not an AppProject" unless YAML.load_file("deploy/argocd/project.yaml")["kind"] == "AppProject"'

  image-builds:
    if: needs.changes.outputs.image_count != '0'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: aqe-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  execution-e2e:
    if: needs.changes.outputs.run_e2e == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: test/e2e/run.sh
      - if: failure()
        run: docker compose logs --no-color

  ci-gate:
    name: ci-gate
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, unit-and-evaluation, helm-and-argocd, image-builds, execution-e2e]
    steps:
      - name: Require every CI workload
        env:
          UNIT_RESULT: ${{ needs.unit-and-evaluation.result }}
          HELM_RESULT: ${{ needs.helm-and-argocd.result }}
          IMAGES_RESULT: ${{ needs.image-builds.result }}
          E2E_RESULT: ${{ needs.execution-e2e.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$HELM_RESULT" = success
          test "$IMAGES_RESULT" = success -o "$IMAGES_RESULT" = skipped
          test "$E2E_RESULT" = success -o "$E2E_RESULT" = skipped
