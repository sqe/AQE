name: Feature request
description: Propose a new AQE capability or quality improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What quality-engineering outcome is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State observable acceptance criteria without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Primary target
      options:
        - Internal agent
        - External agent
        - Website
        - AQE platform
        - Multiple target types
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Safety, privacy, and operational risks
      description: Include authentication, regulated data, network, model-evaluation, or sandbox concerns.
