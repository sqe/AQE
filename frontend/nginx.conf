server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/workflows/ {
        proxy_pass http://aqe-workflow-api:8008/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/diagnostics/ {
        proxy_pass http://aqe-diagnostics:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/knowledge/ {
        client_max_body_size 10m;
        proxy_pass http://aqe-knowledge-ingestion:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/github/ {
        proxy_pass http://aqe-github-connector:8014/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
