<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050806">
  <title>AQE // Automata</title>
  <style>
    :root { --bg:#050806; --panel:#080d09; --green:#86f89b; --dim:#477d50; --line:#183d20; --danger:#ff8b72; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--green); font:14px/1.5 var(--mono); min-height:100vh; }
    body::before { content:""; pointer-events:none; position:fixed; inset:0; opacity:.035; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,var(--green) 4px); }
    button,input,textarea,select { font:inherit; }
    .shell { width:min(1400px,100%); margin:auto; padding:34px; }
    .masthead { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; padding:12px 0 25px; }
    .eyebrow,label,small,footer,.rule { color:var(--dim); font-size:11px; letter-spacing:.12em; }
    h1 { margin:4px 0 0; font-size:clamp(36px,6vw,76px); line-height:.95; font-weight:400; letter-spacing:-.08em; }
    h1 span { color:#d6ffdc; }
    .system-state { text-align:right; display:grid; gap:6px; }
    .rule { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .rule i { flex:1; height:1px; background:var(--line); }
    .view-tabs { display:flex; gap:0; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin; }
    .view-tabs button { flex:0 0 auto; color:var(--dim); background:transparent; border:0; border-bottom:2px solid transparent; padding:12px 18px; font-size:11px; }
    .view-tabs button:hover,.view-tabs button.active { color:#d6ffdc; background:#09130b; border-bottom-color:var(--green); }
    .github-strip { display:grid; grid-template-columns:.7fr 1.3fr 1.3fr .7fr; border:1px solid var(--line); border-top:0; background:#040705; margin-bottom:18px; }
    .github-strip>div { display:flex; flex-direction:column; justify-content:center; min-width:0; padding:11px 14px; border-right:1px solid var(--line); }
    .github-strip>div:last-child { border:0; }
    .github-strip small,.github-strip strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .github-strip strong { color:#b9f6cf; font-size:11px; font-weight:400; margin-top:4px; }
    .knowledge-strip { display:grid; grid-template-columns:repeat(8,minmax(88px,1fr)); border:1px solid var(--line); border-top:0; margin:-18px 0 18px; background:#030604; }
    .knowledge-strip>div { min-width:0; padding:9px 10px; border-right:1px solid var(--line); }
    .knowledge-strip>div:last-child { border-right:0; }
    .knowledge-strip small,.knowledge-strip strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .knowledge-strip strong { color:#d6ffdc; margin-top:2px; font-size:14px; font-weight:400; }
    .knowledge-strip strong.unavailable { color:var(--danger); font-size:9px; }
    a { color:var(--green); text-decoration:none; border-bottom:1px solid var(--dim); }
    a:hover { color:#d6ffdc; border-bottom-color:#d6ffdc; }
    .github-identity { flex-direction:row!important; align-items:center; justify-content:flex-start!important; gap:10px; }
    .status-light { width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:var(--danger); box-shadow:0 0 9px var(--danger); }
    .status-light.ok { background:var(--green); box-shadow:0 0 9px var(--green); }
    .grid { display:grid; gap:1px; background:var(--line); border:1px solid var(--line); margin-top:1px; }
    .primary-grid { grid-template-columns:1.15fr .85fr; }
    .secondary-grid { grid-template-columns:1fr 1fr; }
    .panel { background:var(--panel); padding:22px; min-width:0; }
    .panel-title { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:20px; letter-spacing:.08em; }
    .panel-title b { color:var(--dim); font-weight:400; margin-right:8px; }
    form { display:grid; gap:9px; }
    label { margin-top:7px; }
    label em { float:right; font-style:normal; }
    input,textarea,select { width:100%; color:#d6ffdc; background:#040705; border:1px solid var(--line); border-radius:0; padding:12px; outline:none; resize:vertical; }
    input:focus,textarea:focus,select:focus { border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
    .file-drop { display:grid; place-items:center; min-height:54px; border:1px dashed var(--dim); color:var(--green); cursor:pointer; margin:0; transition:border-color .15s,background .15s; }
    .file-drop:hover { border-color:var(--green); background:#0b160d; }
    .file-drop input { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    button { color:#041006; background:var(--green); border:1px solid var(--green); padding:11px 16px; cursor:pointer; font-weight:700; letter-spacing:.04em; }
    button:hover { background:#d6ffdc; }
    button:disabled { opacity:.45; cursor:wait; }
    button.ghost { color:var(--green); background:transparent; padding:5px 9px; font-size:11px; }
    .command-row { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:8px; }
    .inline-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .example-row { display:flex; gap:8px; margin:4px 0; }
    .example-row button { flex:1; }
    .autopilot-callout { display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px; padding:16px; margin-bottom:18px; border:1px solid var(--green); background:#09160c; }
    .autopilot-callout strong,.autopilot-callout span { display:block; }
    .autopilot-callout strong { color:#d6ffdc; font-size:18px; font-weight:400; letter-spacing:.08em; }
    .autopilot-callout span { color:var(--dim); font-size:10px; margin-top:3px; }
    .autopilot-result { max-height:240px; margin:0 0 18px; }
    .workflow-intro { max-width:860px; color:#91b798; margin:0 0 22px; }
    .requirements-result,.design-result { max-height:460px; }
    .catalog-links { display:grid; gap:7px; margin:0 0 18px; padding:12px; border:1px solid var(--line); background:#040705; }
    .catalog-links span { display:flex; justify-content:space-between; gap:16px; font-size:10px; overflow-wrap:anywhere; }
    .toggle { color:var(--green); margin:0; }
    .toggle input { width:auto; accent-color:var(--green); }
    .fleet-summary { display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
    .fleet-summary strong { color:#d6ffdc; font-size:36px; font-weight:400; }
    .fleet-summary span { color:var(--dim); }
    .agent-list { border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; column-gap:18px; }
    .agent-row { display:grid; grid-template-columns:1fr auto; gap:2px 16px; padding:11px 0; border-bottom:1px solid var(--line); }
    .agent-row b,.agent-row small { display:block; }
    .agent-row p { grid-column:1/-1; color:var(--danger); font-size:11px; margin:6px 0 0; }
    .stamp { font-size:11px; letter-spacing:.05em; }
    .stamp.healthy { color:var(--green); }
    .stamp.checking,.stamp.blocked { color:#d5b86b; }
    .stamp.degraded,.stamp.unhealthy,.stamp.offline { color:var(--danger); }
    .empty { color:var(--dim); min-height:90px; }
    .result { color:#b6dabb; background:#040705; border-left:2px solid var(--green); padding:12px; margin:16px 0 0; max-height:180px; overflow:auto; white-space:pre-wrap; font-size:11px; }
    .events { list-style:none; padding:0; margin:0; }
    .events li { display:grid; grid-template-columns:30px 1fr; border-bottom:1px solid var(--line); padding:9px 0; }
    .events time { color:var(--dim); }
    .graph-layout { display:grid; grid-template-columns:minmax(0,1fr) 290px; min-height:650px; border:1px solid var(--line); background:#040705; }
    .topology { width:100%; height:650px; border-right:1px solid var(--line); }
    .graph-stage text { fill:var(--dim); font:8px var(--mono); letter-spacing:.08em; text-anchor:middle; }
    .graph-stage line { stroke:#0e2313; stroke-width:1; stroke-dasharray:2 8; }
    .edge { fill:none; stroke:var(--dim); stroke-width:1; opacity:.32; marker-end:url(#arrow); transition:opacity .15s,stroke .15s; }
    .edge-group.highlighted .edge { opacity:.85; stroke:var(--green); }
    .edge-group.active .edge { opacity:1; stroke:var(--green); stroke-width:2; stroke-dasharray:7 5; animation:flow 1s linear infinite; filter:url(#glow); }
    .edge-label { fill:var(--green); font:7px var(--mono); text-anchor:middle; paint-order:stroke; stroke:#040705; stroke-width:3px; }
    marker path { fill:var(--dim); }
    .graph-node { cursor:pointer; outline:none; }
    .graph-node .node-halo { fill:transparent; stroke:transparent; }
    .graph-node circle { fill:#07140a; stroke:var(--green); stroke-width:1.5; }
    .graph-node.generated_test circle:not(.node-halo) { fill:var(--green); filter:drop-shadow(0 0 5px var(--green)); }
    .graph-node.target_agent circle { stroke:#d6ffdc; stroke-width:2; }
    .graph-node.status-degraded circle,.graph-node.status-failed circle { stroke:var(--danger); }
    .graph-node.status-running .node-halo { stroke:var(--green); animation:pulse 1.2s ease-out infinite; }
    .graph-node.selected circle:not(.node-halo) { stroke:#fff; stroke-width:3; }
    .graph-node text { fill:#d6ffdc; font:9px var(--mono); text-anchor:start; pointer-events:none; }
    .graph-node .node-type { fill:var(--dim); font-size:8px; text-transform:uppercase; }
    .graph-sidebar { display:grid; grid-template-rows:minmax(230px,auto) 1fr; min-width:0; }
    .node-detail { padding:18px; overflow:auto; border-bottom:1px solid var(--line); }
    .node-detail h3 { font-size:16px; color:#d6ffdc; overflow-wrap:anywhere; }
    .node-detail p,.node-detail dd { color:var(--dim); margin:0 0 12px; overflow-wrap:anywhere; }
    .node-detail dt { font-size:9px; letter-spacing:.1em; }
    .activity-rail { padding:18px; overflow:auto; }
    .activity-rail button { display:grid; grid-template-columns:62px 1fr; width:100%; padding:9px 0; color:var(--green); background:transparent; border:0; border-bottom:1px solid var(--line); text-align:left; letter-spacing:0; font-weight:400; }
    .activity-rail button:hover { background:#0b160d; }
    .activity-rail time { grid-row:1/3; color:var(--dim); font-size:9px; }
    .activity-rail b { font-size:10px; font-weight:500; }
    .activity-rail span,.activity-rail p { color:var(--dim); font-size:9px; }
    .graph-stats { color:var(--dim); font-size:10px; }
    .workflow-history { margin-top:18px; border:1px solid var(--line); background:#040705; }
    .workflow-history>header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 16px; border-bottom:1px solid var(--line); }
    .workflow-history>header small,.workflow-history>header strong { display:block; }
    .workflow-history>header strong { color:#d6ffdc; font-weight:400; }
    .workflow-history-list { max-height:380px; overflow:auto; }
    .workflow-history article { display:grid; grid-template-columns:150px minmax(220px,1fr) 120px 80px 75px; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--line); }
    .workflow-history article time,.workflow-history article small,.workflow-history article span { color:var(--dim); font-size:9px; }
    .workflow-history article b,.workflow-history article div span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .workflow-history article b { color:#b9f6cf; font-weight:400; }
    .topology-3d-legend { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-bottom:0; background:#030604; }
    .topology-3d-legend section { min-width:0; padding:11px 12px; border-right:1px solid var(--line); }
    .topology-3d-legend section:last-child { border-right:0; }
    .topology-3d-legend small { display:block; margin-bottom:7px; }
    .topology-3d-legend button { display:inline-flex; align-items:center; max-width:100%; margin:2px 5px 2px 0; padding:4px 6px; color:#b9f6cf; background:#061009; border:1px solid var(--line); font-size:9px; font-weight:400; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .node-dot { width:6px; height:6px; margin-right:5px; border-radius:50%; background:var(--green); flex:0 0 auto; }
    .node-dot.status-running,.node-dot.status-queued { background:#ffd166; }
    .node-dot.status-failed,.node-dot.status-unreachable { background:var(--danger); }
    .topology-3d-shell { position:relative; height:min(72vh,820px); min-height:580px; overflow:hidden; border:1px solid var(--line); background:#020604; }
    .topology-3d { position:absolute; inset:0; cursor:grab; }
    .topology-3d:active { cursor:grabbing; }
    .topology-3d canvas { display:block; width:100%; height:100%; }
    .topology-hud { position:absolute; left:18px; bottom:16px; display:flex; gap:8px; pointer-events:none; }
    .topology-hud span { color:var(--dim); border:1px solid var(--line); background:rgba(2,6,4,.82); padding:5px 8px; font-size:9px; letter-spacing:.08em; }
    .topology-3d-inspector { position:absolute; right:16px; bottom:16px; display:grid; width:260px; max-height:46%; overflow:auto; gap:5px; padding:16px; border:1px solid var(--line); background:rgba(4,11,6,.92); backdrop-filter:blur(8px); }
    .topology-3d-inspector small:not(:first-child) { margin-top:16px; }
    .topology-3d-inspector strong { color:#d6ffdc; font-weight:400; overflow-wrap:anywhere; }
    .topology-3d-inspector span { color:var(--dim); font-size:10px; overflow-wrap:anywhere; }
    @keyframes flow { to { stroke-dashoffset:-12; } }
    @keyframes pulse { from { r:13; opacity:.8 } to { r:24; opacity:0 } }
    footer { display:flex; justify-content:space-between; gap:20px; padding:20px 0 0; text-transform:uppercase; }
    @media (max-width:800px) { .shell{padding:18px}.primary-grid,.secondary-grid,.graph-layout,.inline-fields,.agent-list,.github-strip,.autopilot-callout{grid-template-columns:1fr}.knowledge-strip{grid-template-columns:repeat(2,1fr);margin-top:-18px}.knowledge-strip>div{border-bottom:1px solid var(--line)}.github-strip>div{border-right:0;border-bottom:1px solid var(--line)}.workflow-history article{grid-template-columns:1fr 100px}.workflow-history article time,.workflow-history article small,.workflow-history article a{display:none}.topology-3d-legend{grid-template-columns:1fr 1fr}.topology-3d-legend section{border-bottom:1px solid var(--line)}.example-row{flex-direction:column}.topology{height:560px;border-right:0;border-bottom:1px solid var(--line)}.topology-3d-inspector{width:calc(100% - 32px)}.topology-hud{display:none}.masthead{align-items:flex-start;flex-direction:column}.system-state{text-align:left}.rule span:nth-of-type(n+3),.rule i:nth-of-type(n+3){display:none}footer{display:grid;grid-template-columns:1fr 1fr}.command-row{align-items:stretch;flex-direction:column} }
  </style>
</head>
<body>
  <div id="root"><main class="shell"><p>booting aqe automata_</p></main></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
